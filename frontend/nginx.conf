server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 与 application.yml 的 max-request-size: 500MB 对齐。
        # 不显式设置时 nginx 默认只收 1MB，经前端入口上传稍大的图会直接 413
        # （直连后端 8085 却不报错），表现为「同样的图，走 9095 失败」。
        client_max_body_size 500m;
        # 批量上传是长请求，放宽读写超时，避免大任务在网关处被截断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /ai/ {
        proxy_pass http://ai-engine:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 100m;
    }
}
