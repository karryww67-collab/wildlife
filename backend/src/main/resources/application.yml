spring:
  application:
    name: wildlife-recognition

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/wildlife_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:9}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

server:
  port: 8085

app:
  image:
    # 上传图像落盘根目录。容器内由 docker-compose 的 APP_IMAGE_STORAGE_PATH 覆盖为
    # /shared-data/originals（与 ai-engine 共享的挂载卷），本地开发用下面的默认值。
    storage-path: ${APP_IMAGE_STORAGE_PATH:../ai-engine/data/originals}
